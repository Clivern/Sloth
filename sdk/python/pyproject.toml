[project]
name = "sloth-sdk"
version = "0.1.0"
description = "Build A2A agents that register, protect and call each other through Sloth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sloth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
