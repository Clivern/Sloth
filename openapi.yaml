components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: _cognit_session
    userApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    workspaceAccessKey:
      type: apiKey
      in: header
      name: X-Access-Key
    metricsBasicAuth:
      type: http
      scheme: basic

  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    agentName:
      name: agentName
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
    instanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
    checkId:
      name: checkId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
      description: The check id `ttl` is reserved for the instance lease.
    apiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    inviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    memberUserId:
      name: memberUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    auditId:
      name: auditId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    intentionId:
      name: intentionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    trafficId:
      name: trafficId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    kvKey:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: Key path segment(s) after `/kv/`
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Validation or bad input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Dependency or billing provider not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string

    Status:
      type: object
      properties:
        status:
          type: string
          enum: [ok, not_ok]

    SuccessMessage:
      type: object
      properties:
        successMessage:
          type: string

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, regular, readonly]
        isActive:
          type: boolean
        isEmailVerified:
          type: boolean
        name:
          type: string
        avatar:
          type: string
          format: uri
        language:
          type: string
          enum: [en, fr]
        theme:
          type: string
          enum: [default, blue, slate, emerald, dark]
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProfileResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/Profile"

    Settings:
      type: object
      description: Values are stored as strings.
      properties:
        platform_email:
          type: string
        maintenance_mode:
          type: string
          example: "false"

    PaginationMeta:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          format: int64

    SetupRequest:
      type: object
      required: [platformEmail]
      properties:
        platformEmail:
          type: string
          format: email
          minLength: 4
          maxLength: 60

    UpdateProfileRequest:
      type: object
      required: [language, theme]
      properties:
        name:
          type: string
          maxLength: 255
        language:
          type: string
          enum: [en, fr]
        theme:
          type: string
          enum: [default, blue, slate, emerald, dark]

    UpdateSettingsRequest:
      type: object
      required: [platformEmail]
      properties:
        platformEmail:
          type: string
          format: email
          maxLength: 255
        maintenanceMode:
          type: boolean

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        expiresAt:
          type: string
          format: date-time
          maxLength: 64

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: Returned only on create
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MeUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string

    MeSession:
      type: object
      properties:
        principalType:
          type: string
          example: session
        user:
          $ref: "#/components/schemas/MeUser"

    MeAPIKey:
      type: object
      properties:
        principalType:
          type: string
          example: api_key
        owner:
          $ref: "#/components/schemas/MeUser"
        apiKey:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            expiresAt:
              type: string
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    MeAccessKey:
      type: object
      properties:
        principalType:
          type: string
          example: access_key
        accessKey:
          $ref: "#/components/schemas/AccessKey"

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 60

    UpdateWorkspaceRequest:
      $ref: "#/components/schemas/CreateWorkspaceRequest"

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        handle:
          type: string
        count:
          type: integer
          format: int64
        role:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateInviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          minLength: 4
          maxLength: 255
        role:
          $ref: "#/components/schemas/WorkspaceRole"

    WorkspaceRole:
      type: string
      enum: [admin, regular, readonly]

    Invite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        token:
          type: string
          description: Returned only on create
        status:
          type: string
        inviterUserId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/WorkspaceRole"

    WorkspaceMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAccessKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
        expiresAt:
          type: string
          format: date-time
          maxLength: 64
        permissions:
          type: array
          items:
            type: string

    AccessKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        key:
          type: string
          description: Returned only on create
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BillingStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        providerCustomerId:
          type: string
        aiTokensBalance:
          type: integer
          format: int64
        tokensPerUsd:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BillingUsage:
      type: object
      properties:
        periodReset:
          type: string
          format: date-time
        used:
          type: object
          properties:
            workspaceMembers:
              type: integer
              format: int64
            aiTokens:
              type: integer
              format: int64
            aiCost:
              type: number
        limits:
          type: object
          properties:
            workspaceMembers:
              type: integer
              format: int64
            aiTokens:
              type: integer
              format: int64

    BillingCheckoutRequest:
      type: object
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          format: int64
          minimum: 100

    BillingSession:
      type: object
      properties:
        url:
          type: string
          format: uri

    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
          format: uuid
        ipAddress:
          type: string
        userAgent:
          type: string
        meta:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    UpsertAgentRequest:
      type: object
      required: [card]
      properties:
        card:
          type: object
          description: A2A Agent Card JSON object
          additionalProperties: true
        version:
          type: string
          maxLength: 40
          description: Optional; taken from card.version when omitted

    AgentInstanceSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
        address:
          type: string
        port:
          type: integer
        datacenter:
          type: string
          nullable: true
        meta:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [passing, warning, critical]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        card:
          type: object
          additionalProperties: true
        cardChecksum:
          type: string
        health:
          type: string
        instances:
          type: array
          items:
            $ref: "#/components/schemas/AgentInstanceSummary"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterInstanceRequest:
      type: object
      required: [address, port]
      properties:
        address:
          type: string
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        datacenter:
          type: string
          maxLength: 60
        meta:
          type: object
          additionalProperties: true
        leaseTtl:
          type: integer
          minimum: 5
          maximum: 86400
          description: Lease length in seconds; default 30

    HealthCheck:
      type: object
      properties:
        checkId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [ttl, http, tcp]
        source:
          type: string
          enum: [lease, agent]
          description: "`lease` is the instance lease; `agent` is copied from an agent check template."
        status:
          type: string
          enum: [passing, warning, critical]
          description: A TTL check whose TTL has run out is reported as critical.
        output:
          type: string
          nullable: true
        ttlExpiresAt:
          type: string
          format: date-time
          nullable: true
        lastRunAt:
          type: string
          format: date-time
          nullable: true

    UpsertAgentCheckRequest:
      type: object
      required: [type]
      properties:
        name:
          type: string
          maxLength: 120
          description: Defaults to the check id.
        type:
          type: string
          enum: [ttl, http, tcp]
        path:
          type: string
          maxLength: 255
          description: Required for `http`. Must start with `/`.
          example: /healthz
        scheme:
          type: string
          enum: [http, https]
          default: http
          description: "`http` only."
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: "`http` and `tcp`. Defaults to the instance port."
        interval:
          type: integer
          minimum: 5
          maximum: 3600
          default: 10
          description: Seconds between probes, for `http` and `tcp`.
        timeout:
          type: integer
          minimum: 1
          maximum: 60
          default: 2
          description: Seconds a probe may take. Must be shorter than the interval.
        ttl:
          type: integer
          minimum: 5
          maximum: 86400
          description: Required for `ttl`. Seconds the instance has to report between updates.

    AgentCheck:
      type: object
      properties:
        checkId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [ttl, http, tcp]
        path:
          type: string
        scheme:
          type: string
        port:
          type: integer
        interval:
          type: integer
        timeout:
          type: integer
        ttl:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReportCheckRequest:
      type: object
      properties:
        output:
          type: string
          maxLength: 4096

    Instance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        instanceId:
          type: string
        address:
          type: string
        port:
          type: integer
        datacenter:
          type: string
          nullable: true
        meta:
          type: object
          additionalProperties: true
        status:
          type: string
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    IntentionSource:
      type: object
      required: [agent]
      properties:
        agent:
          type: string
          maxLength: 100

    IntentionDestination:
      type: object
      required: [agent]
      properties:
        agent:
          type: string
          maxLength: 100
        skill:
          type: string
          maxLength: 120

    SaveIntentionRequest:
      type: object
      required: [source, destination, action]
      properties:
        source:
          $ref: "#/components/schemas/IntentionSource"
        destination:
          $ref: "#/components/schemas/IntentionDestination"
        action:
          type: string
          enum: [allow, deny]

    CheckIntentionRequest:
      type: object
      required: [source, destination]
      properties:
        source:
          $ref: "#/components/schemas/IntentionSource"
        destination:
          $ref: "#/components/schemas/IntentionDestination"

    Intention:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        source:
          type: string
        destination:
          type: string
        skill:
          type: string
        action:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CheckIntentionResponse:
      type: object
      properties:
        action:
          type: string
        intention:
          $ref: "#/components/schemas/Intention"

    PutKeyValueRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
        expiresAt:
          type: string
          format: date-time
          maxLength: 64

    KeyValueItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        key:
          type: string
        value:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TrafficCall:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        sourceInstance:
          type: string
        destinationInstance:
          type: string
        skill:
          type: string
        verb:
          type: string
        decision:
          type: string
        result:
          type: string
        latencyMs:
          type: integer
          format: int64
        taskId:
          type: string
        createdAt:
          type: string
          format: date-time
