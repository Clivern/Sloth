openapi: 3.0.3
info:
  title: Cognit API
  description: |
    Cognit is a Service Discovery Registry for AI Agents. Agents register, discover each other by skill,
    and call through a gateway that manages load balancing, health, and policy on every request.

    **Authentication**: session cookie `_cognit_session` or user API key `X-API-Key`. Workspace access keys `X-Access-Key`

    Errors are returned as `{"errorMessage": "..."}`.
  version: 1.0.0
  license:
    name: Proprietary

servers:
  - url: /
    description: App URL

tags:
  - name: Public
  - name: Session
  - name: Profile
  - name: Settings
  - name: API keys
  - name: Workspaces
  - name: Invites
  - name: Members
  - name: Access keys
  - name: Billing
  - name: Audits
  - name: Agents
  - name: Instances
  - name: Health checks
  - name: Intentions
  - name: Key-value
  - name: Traffic
  - name: Metrics

security:
  - sessionCookie: []
  - userApiKey: []

paths:
  /api/v1/public/_health:
    get:
      tags: [Public]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /api/v1/public/_ready:
    get:
      tags: [Public]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /api/v1/public/action/setup:
    post:
      tags: [Public]
      summary: Initial platform setup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Setup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/public/action/setup/status:
    get:
      tags: [Public]
      summary: Setup completion status
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed:
                    type: boolean
                  edition:
                    type: string

  /api/v1/public/action/logout:
    post:
      tags: [Public]
      summary: Clear session cookie
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /api/v1/public/action/oauth/github:
    get:
      tags: [Public]
      summary: Start GitHub OAuth
      security: []
      responses:
        "302":
          description: Redirect to GitHub

  /api/v1/public/action/oauth/github/callback:
    get:
      tags: [Public]
      summary: GitHub OAuth callback
      security: []
      responses:
        "302":
          description: Redirect to app with session cookie set

  /api/v1/public/action/oauth/google:
    get:
      tags: [Public]
      summary: Start Google OAuth
      security: []
      responses:
        "302":
          description: Redirect to Google

  /api/v1/public/action/oauth/google/callback:
    get:
      tags: [Public]
      summary: Google OAuth callback
      security: []
      responses:
        "302":
          description: Redirect to app with session cookie set

  /api/v1/public/action/stripe/webhook:
    post:
      tags: [Billing]
      summary: Stripe webhook (SaaS edition only)
      security: []
      description: Registered only when the app runs in SaaS mode. Verified with the `Stripe-Signature` header.
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/public/_metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      security:
        - metricsBasicAuth: []
      responses:
        "200":
          description: Prometheus text exposition format

  /api/v1/me:
    get:
      tags: [Session]
      summary: Current principal
      description: |
        Returns the caller's principal. `X-API-Key` takes precedence over `X-Access-Key`,
        which takes precedence over the session cookie.
      security:
        - sessionCookie: []
        - userApiKey: []
        - workspaceAccessKey: []
      responses:
        "200":
          description: Principal metadata
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MeSession"
                  - $ref: "#/components/schemas/MeAPIKey"
                  - $ref: "#/components/schemas/MeAccessKey"
                discriminator:
                  propertyName: principalType
                  mapping:
                    session: "#/components/schemas/MeSession"
                    api_key: "#/components/schemas/MeAPIKey"
                    access_key: "#/components/schemas/MeAccessKey"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/action/profile:
    get:
      tags: [Profile]
      summary: Get user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProfileResponse"
                  - $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/action/settings:
    get:
      tags: [Settings]
      summary: Get app settings (admin)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Settings]
      summary: Update app settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/apiKeys:
    post:
      tags: [API keys]
      summary: Create user API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: Created (includes secret once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [API keys]
      summary: List user API keys
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/apiKeys/{apiKeyId}:
    get:
      tags: [API keys]
      summary: Get user API key
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [API keys]
      summary: Delete user API key
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces:
    post:
      tags: [Workspaces]
      summary: Create workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Workspaces]
      summary: List workspaces for current user
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}:
    get:
      tags: [Workspaces]
      summary: Get workspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Workspaces]
      summary: Update workspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Workspaces]
      summary: Delete workspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/invites:
    post:
      tags: [Invites]
      summary: Create member invite
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Invites]
      summary: List invites
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/invites/{inviteId}:
    get:
      tags: [Invites]
      summary: Get invite
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/inviteId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Invites]
      summary: Revoke invite
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/inviteId"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/members:
    get:
      tags: [Members]
      summary: List workspace members
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceMember"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/members/{memberUserId}:
    put:
      tags: [Members]
      summary: Update member role
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/memberUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Members]
      summary: Remove member
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/memberUserId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/keys:
    post:
      tags: [Access keys]
      summary: Create workspace access key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessKeyRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Access keys]
      summary: List workspace access keys
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessKey"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/keys/{keyId}:
    get:
      tags: [Access keys]
      summary: Get access key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/keyId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Access keys]
      summary: Delete access key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/keyId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/billing:
    get:
      tags: [Billing]
      summary: Billing status (SaaS only)
      description: Registered only in SaaS mode. Accepts workspace access keys.
      security:
        - sessionCookie: []
        - userApiKey: []
        - workspaceAccessKey: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/billing/usage:
    get:
      tags: [Billing]
      summary: Billing usage (SaaS only)
      description: Registered only in SaaS mode. Accepts workspace access keys.
      security:
        - sessionCookie: []
        - userApiKey: []
        - workspaceAccessKey: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/billing/checkout:
    post:
      tags: [Billing]
      summary: Start Stripe checkout (SaaS only)
      description: Buys AI token credit for the workspace.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/billing/portal:
    post:
      tags: [Billing]
      summary: Open Stripe customer portal (SaaS only)
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/audits:
    get:
      tags: [Audits]
      summary: List audit events
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  audits:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

