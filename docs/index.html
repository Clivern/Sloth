  <style>
    :root {
      --bg: #f7f6f3;
      --ink: #37352f;
      --ink-soft: #6b6966;
      --cyan: #0e7490;
      --cyan-soft: #0891b2;
      --health: #059669;
      --amber: #d97706;
      --down: #dc2626;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      font-family: "Sora", ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: var(--bg);
    }

    .orbit {
      position: absolute;
      top: 50%;
      right: clamp(1.5rem, calc((100vw - 1280px) * 0.25), 10rem);
      width: min(54vw, 660px);
      height: min(60vh, 520px);
      transform: translateY(-50%);
      opacity: 0.95;
      animation: drift 28s ease-in-out infinite;
    }

    .orbit svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .orbit-ring {
      fill: none;
      stroke: rgba(55, 53, 47, 0.08);
      stroke-width: 1;
      stroke-dasharray: 2 7;
    }

    .link {
      fill: none;
      stroke: rgba(55, 53, 47, 0.2);
      stroke-width: 1.3;
      stroke-linecap: round;
    }

    .link.cyan { stroke: rgba(14, 116, 144, 0.35); }
    .link.health { stroke: rgba(5, 150, 105, 0.32); }

    .msg {
      fill: var(--cyan);
      opacity: 0;
    }

    .hub {
      fill: #fff;
      stroke: rgba(55, 53, 47, 0.22);
      stroke-width: 2;
    }

    .hub-halo {
      fill: none;
      stroke: rgba(14, 116, 144, 0.32);
      stroke-width: 1.2;
      transform-origin: center;
      transform-box: fill-box;
      animation: pulse-ring 4s ease-out infinite;
    }

    .hub-halo.late {
      stroke: rgba(5, 150, 105, 0.3);
      animation-delay: 2s;
    }

    .hub-logo { fill: var(--ink); }

    .hub-beat {
      fill: none;
      stroke: #22d3ee;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 18 100;
      stroke-dashoffset: 18;
      animation: beat 2.6s linear infinite;
    }

    .agent-body {
      fill: #fff;
      stroke: rgba(55, 53, 47, 0.3);
      stroke-width: 1.4;
    }

    .eye { fill: var(--ink); }

    .mouth,
    .antenna {
      stroke: rgba(55, 53, 47, 0.45);
      stroke-width: 1.4;
      stroke-linecap: round;
    }

    .tip { fill: var(--ink); }
    .tip.cyan { fill: var(--cyan); }
    .tip.health { fill: var(--health); }

    .tip.amber { fill: var(--amber); }

    .agent-body {
      filter: drop-shadow(0 2px 3px rgba(55, 53, 47, 0.08));
    }

    .eye.cyan { fill: var(--cyan); }
    .eye-white { fill: #fff; stroke: rgba(55, 53, 47, 0.35); stroke-width: 1; }
    .glint { fill: #fff; }
    .cheek { fill: rgba(217, 119, 6, 0.22); }
    .mouth { fill: none; stroke-linejoin: round; }
    .mouth-fill { fill: rgba(55, 53, 47, 0.55); }
    .visor { fill: var(--ink); }
    .visor-dot { fill: #34d399; }

    .headset {
      fill: none;
      stroke: rgba(55, 53, 47, 0.45);
      stroke-width: 1.6;
      stroke-linecap: round;
    }

    .earcup { fill: var(--health); }

    .agent-tag rect {
      fill: #fff;
      stroke: rgba(55, 53, 47, 0.14);
      stroke-width: 1;
    }

    .agent-tag text {
      fill: var(--ink);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      text-anchor: middle;
    }

    .tag-dot { fill: var(--ink-soft); }
    .tag-dot.cyan { fill: var(--cyan); }
    .tag-dot.health { fill: var(--health); }
    .tag-dot.amber { fill: var(--amber); }

    .agent-tag .iid {
      fill: var(--ink-soft);
      font-weight: 400;
    }

    /* Instance churn: unhealthy -> deregistered -> new instance registers. */
    .agent {
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 0.6s var(--ease);
    }

    .agent .agent-body,
    .agent .tip,
    .agent .tag-dot {
      transition: fill 0.4s var(--ease), stroke 0.4s var(--ease);
    }

    .agent.unhealthy .agent-body {
      stroke: var(--down);
      stroke-dasharray: 4 3;
    }

    .agent.unhealthy .tip,
    .agent.unhealthy .tag-dot {
      fill: var(--down);
      animation: blink 0.9s steps(2, start) infinite;
    }

    .agent.offline { opacity: 0.12; }

    .agent.joining { animation: join 0.7s var(--ease); }

    .link,
    .msg-route {
      transition: opacity 0.6s var(--ease), stroke 0.4s var(--ease);
    }

    .link.unhealthy { stroke: rgba(220, 38, 38, 0.55); }

    .status {
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      text-anchor: middle;
      fill: var(--down);
      opacity: 0;
      transition: opacity 0.4s var(--ease);
    }

    .status.up { fill: var(--health); }
    .status.show { opacity: 1; }

    .link.offline,
    .msg-route.muted { opacity: 0; }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: min(1180px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 3rem 0 4.5rem;
    }

    .copy {
      max-width: 34rem;
      width: min(100%, 34rem);
    }

    .brand {
      display: block;
      margin: 0 0 1.5rem;
      width: clamp(4.5rem, 11vw, 6.5rem);
      height: auto;
    }

    h1 {
      margin: 0 0 1.85rem;
      max-width: 16ch;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }

    .hero-gradient-text {
      background: linear-gradient(
        90deg,
        #37352f 0%,
        #0e7490 24%,
        #0891b2 40%,
        #14b8a6 52%,
        #0e7490 68%,
        #5b6775 86%,
        #37352f 100%
      );
      background-size: 400% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: hero-gradient-shift 11s ease-in-out infinite;
      overflow: visible;
      padding-bottom: 0.08em;
    }

    .lead {
      margin: 0 0 1rem;
      max-width: 31rem;
      color: var(--ink-soft);
      font-size: clamp(0.92rem, 1.4vw, 1rem);
      line-height: 1.55;
      font-weight: 400;
    }

    .lead + .btn { margin-top: 0.85rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0 1.25rem;
      border-radius: 0.45rem;
      background: var(--ink);
      color: var(--bg);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s var(--ease), transform 0.2s var(--ease);
    }

    .btn:hover {
      background: #2f2d29;
      transform: translateY(-1px);
    }

    .site-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      padding: 0.85rem 1.25rem calc(0.85rem + env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .site-footer a {
      pointer-events: auto;
      color: var(--ink-soft);
      font-size: 0.8rem;
      text-decoration: none;
      transition: color 0.2s var(--ease);
    }

    .site-footer a:hover { color: var(--ink); }

    @media (max-width: 900px) {
      .orbit {
        width: min(70vw, 520px);
        height: min(56vh, 560px);
        right: -8%;
        top: 58%;
        opacity: 0.42;
      }
    }

    @media (max-width: 720px) {
      .orbit {
        width: 120%;
        height: 52vh;
        right: -35%;
        top: auto;
        bottom: -6%;
        transform: none;
        opacity: 0.32;
      }
      .site-footer { position: static; }
      .page { padding-bottom: 2rem; }
    }

    @keyframes drift {
      0%, 100% { transform: translateY(-50%) translate3d(0, 0, 0) scale(1); }
      50% { transform: translateY(-50%) translate3d(-1%, -1.2%, 0) scale(1.02); }
    }

    @media (max-width: 720px) {
      @keyframes drift {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(-1%, -1%, 0) scale(1.02); }
      }
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.85); opacity: 0.65; }
      70% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    @keyframes blink {
      to { opacity: 0.25; }
    }

    @keyframes join {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes beat {
      0% { stroke-dashoffset: 18; }
      70%, 100% { stroke-dashoffset: -100; }
    }

    @keyframes hero-gradient-shift {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }
  </style>
</head>

      <p class="lead">
        Agents register, discover each other by skill, and call through a gateway that manages load balancing, health, and policy on every request.

  <script>
    (function () {
      var svg = document.querySelector('.orbit svg');
      if (!svg) return;

      var SVG_NS = 'http://www.w3.org/2000/svg';
      var agents = {};
      var busy = 0;

      function instanceIp() {
        var octet = function (min, max) {
          return min + Math.floor(Math.random() * (max - min + 1));
        };
        return '10.0.' + octet(0, 9) + '.' + octet(2, 254);
      }

      // Resize the pill to fit "name ip".
      function fit(a) {
        var w = a.text.getComputedTextLength() + 28;
        var cx = parseFloat(a.text.getAttribute('x')) - 5;
        a.rect.setAttribute('x', (cx - w / 2).toFixed(1));
        a.rect.setAttribute('width', w.toFixed(1));
        a.dot.setAttribute('cx', (cx - w / 2 + 10).toFixed(1));
      }

      function setLabel(a) {
        a.iid.textContent = ' ' + instanceIp();
        fit(a);
      }

      svg.querySelectorAll('.agent').forEach(function (el) {
        var name = el.dataset.agent;
        var text = el.querySelector('.agent-tag text');
        var iid = document.createElementNS(SVG_NS, 'tspan');
        iid.setAttribute('class', 'iid');
        text.appendChild(iid);
        var a = {
          name: name,
          el: el,
          text: text,
          iid: iid,
          rect: el.querySelector('.agent-tag rect'),
          dot: el.querySelector('.tag-dot'),
          link: svg.querySelector('.link[data-agent="' + name + '"]'),
          status: document.createElementNS(SVG_NS, 'text'),
          state: 'healthy'
        };
        var rect = a.rect;
        a.status.setAttribute('class', 'status');
        a.status.setAttribute('x', parseFloat(text.getAttribute('x')) - 5);
        a.status.setAttribute('y', parseFloat(rect.getAttribute('y')) + 31);
        svg.appendChild(a.status);
        setLabel(a);
        agents[name] = a;
      });

      // Re-measure pills once the web font is in.
      if (document.fonts) {
        document.fonts.ready.then(function () {
          Object.keys(agents).forEach(function (n) { fit(agents[n]); });
        });
      }

      var routes = Array.prototype.slice.call(svg.querySelectorAll('.msg-route'));

      // Hide in-flight messages that touch an instance which isn't healthy.
      function syncRoutes() {
        routes.forEach(function (r) {
          var muted = r.dataset.route.split(' ').some(function (n) {
            return agents[n].state !== 'healthy';
          });
          r.classList.toggle('muted', muted);
        });
      }

      var STATUS = {
        unhealthy: 'health check failed',
        offline: 'deregistered',
        joining: 'registered'
      };

      // Status line under the pill; "registered" lingers briefly once healthy.
      function setStatus(a, state) {
        clearTimeout(a.statusTimer);
        if (state === 'healthy') {
          a.statusTimer = setTimeout(function () {
            a.status.classList.remove('show');
          }, 1400);
          return;
        }
        a.status.textContent = STATUS[state];
        a.status.setAttribute('class', 'status show' + (state === 'joining' ? ' up' : ''));
      }

      function setState(a, state) {
        setStatus(a, state);
        a.el.classList.remove('unhealthy', 'offline', 'joining');
        a.link.classList.remove('unhealthy', 'offline');
        a.state = state;
        if (state !== 'healthy') {
          a.el.classList.add(state);
          if (state !== 'joining') a.link.classList.add(state);
        }
        syncRoutes();
      }

      function churn(a) {
        busy++;
        setState(a, 'unhealthy');
        setTimeout(function () {
          setState(a, 'offline');
          setTimeout(function () {
            setLabel(a);
            setState(a, 'joining');
            setTimeout(function () {
              setState(a, 'healthy');
              busy--;
            }, 700);
          }, 1800);
        }, 2400);
      }

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      setInterval(function () {
        if (document.hidden || busy >= 2) return;
        var healthy = Object.keys(agents).filter(function (n) {
          return agents[n].state === 'healthy';
        });
        churn(agents[healthy[Math.floor(Math.random() * healthy.length)]]);
      }, 3200);
    })();
  </script>
